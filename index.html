<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>天气时钟相册</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
  :root{
    --text: #eaf1ff;
    --muted: rgba(234,241,255,.55);
    --line: rgba(255,255,255,.10);
    --accent: #5eead4;
    --transition-speed: 0s; 
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ 
    height:100%; 
    overflow: hidden; 
    user-select: none; 
    background: #070b16;
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
  }

  /* ===== 强制旋转的容器 ===== */
  #rotateWrapper {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    transition: transform 0.3s ease; /* 旋转时加一点平滑 */
    background:
      radial-gradient(1200px 700px at 10% -15%, #1e3a6e 0%, transparent 62%),
      radial-gradient(1000px 650px at 105% 115%, #2c1c5e 0%, transparent 62%),
      #070b16;
  }

  /* 强制横向时的样式 */
  body.force-landscape #rotateWrapper {
    /* 旋转 90 度，并将容器宽高对调 */
    transform: rotate(90deg) translateY(-100%);
    width: 100vh;
    height: 100vw;
  }

  /* ===== 整体布局 ===== */
  .app{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 24px 10px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
  }

  .main{
    flex: 1;
    display: flex;
    gap: 20px;
    min-height: 0;
  }

  .panel{
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid var(--line);
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  /* 左侧栏 */
  .panel-left{
    flex: 0 0 32%;
    padding: clamp(22px, 3.2vh, 44px);
    justify-content: space-between;
    gap: 15px;
  }

  .weather-section {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.5vh, 20px);
  }

  .location{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(13px, 1.3vw, 19px);
    letter-spacing: .1em;
    color: var(--muted);
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    flex: none;
  }

  .weather-main{
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.2vw, 18px);
  }

  .wicon{
    font-size: clamp(48px, 6vw, 90px);
    line-height: 1;
  }

  .temp{
    display: flex;
    align-items: flex-start;
    font-size: clamp(50px, 7.5vw, 110px);
    font-weight: 200;
    line-height: .86;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
  }
  .temp .unit{
    font-size: .26em;
    font-weight: 400;
    color: var(--muted);
    margin-top: .55em;
    margin-left: .12em;
  }

  .desc{
    font-size: clamp(15px, 1.6vw, 22px);
    letter-spacing: .07em;
    color: rgba(234,241,255,.85);
  }

  .metrics{
    display: flex;
    gap: 12px;
    padding-top: clamp(10px, 1.5vh, 16px);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .metric{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .metric .label{
    font-size: clamp(10px, .9vw, 12px);
    letter-spacing: .14em;
    color: var(--muted);
  }
  .metric .value{
    font-size: clamp(14px, 1.5vw, 20px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* 文案区 */
  .custom-quote{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 15px 0;
    padding: 20px;
    width: 100%;
    font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', serif; 
    font-size: var(--quote-size, 36px);
    line-height: 1.3;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 2px 15px rgba(255,255,255,0.3), 0 0 2px rgba(255,255,255,0.5);
    border-radius: 16px;
    border: 1px dashed transparent;
    outline: none;
    word-break: break-word;
    white-space: pre-wrap;
    overflow-y: auto;
    user-select: text;
  }

  .custom-quote:hover, .custom-quote:focus {
    border-color: rgba(255,255,255,.2);
    background: rgba(255,255,255,.03);
  }

  .custom-quote:empty::before {
    content: "在此挥毫泼墨...";
    color: var(--muted);
    font-style: italic;
    font-family: sans-serif; 
    font-size: 16px;
    text-shadow: none;
    pointer-events: none;
  }

  /* 时间区 */
  .time-section {
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .date-main{
    font-size: clamp(24px, 2.8vw, 42px);
    font-weight: 200;
    line-height: 1.1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .date-sub{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .week{
    padding: 4px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 1.2vw, 16px);
    color: #a7f3e4;
    background: rgba(94,234,212,.12);
    border: 1px solid rgba(94,234,212,.30);
  }
  .clock{
    font-size: clamp(36px, 4.5vw, 68px);
    font-weight: 300;
    letter-spacing: .05em;
    color: rgba(234,241,255,.85);
    font-variant-numeric: tabular-nums;
  }

  /* 右侧图片区 */
  .panel-right{
    flex: 1;
    position: relative;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.2);
  }

  .image-container {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .upload-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border: 2px dashed rgba(255,255,255,.15);
    border-radius: 20px;
    cursor: pointer;
  }

  .upload-placeholder svg {
    width: 48px;
    height: 48px;
    fill: var(--muted);
    margin-bottom: 12px;
  }

  .upload-placeholder p {
    font-size: 16px;
    color: var(--muted);
  }

  #imageUpload { display: none; }

  /* 底部控制条 */
  .controls{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    padding: 2px 6px 4px;
    font-size: 13.5px;
    color: var(--muted);
  }

  select, button{
    font: inherit;
    color: var(--text);
    background: rgba(255,255,255,.07);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 13px;
    cursor: pointer;
    outline: none;
  }
  select:hover, button:hover{
    background: rgba(255,255,255,.15);
  }
  select option{ background:#141b2c; color:#eaf1ff; }

  #status{ min-width: 160px; }
  #status.error{ color: #fca5a5; }

  /* ===== 竖屏兜底（未强制横屏时） ===== */
  @media (max-aspect-ratio: 1/1) {
    body:not(.force-landscape) .main { 
      flex-direction: column; 
    }
    body:not(.force-landscape) .panel-left { 
      flex: none; 
    }
    body:not(.force-landscape) .panel-right { 
      min-height: 400px; 
    }
  }
</style>
</head>
<body>

<!-- 旋转包裹层 -->
<div id="rotateWrapper">
  <div class="app">
    <main class="main">
      <section class="panel panel-left">
        <div class="weather-section">
          <div class="location">
            <span class="dot"></span>
            <span id="city">定位中…</span>
          </div>
          <div class="weather-main">
            <div class="wicon" id="wicon">⛅</div>
            <div class="temp">
              <span id="temp">--</span><span class="unit">°C</span>
            </div>
          </div>
          <div class="desc" id="wdesc">正在获取天气…</div>
          <div class="metrics">
            <div class="metric">
              <span class="label">体感</span>
              <span class="value" id="feels">--</span>
            </div>
            <div class="metric">
              <span class="label">湿度</span>
              <span class="value" id="hum">--</span>
            </div>
            <div class="metric">
              <span class="label">风速</span>
              <span class="value" id="wind">--</span>
            </div>
          </div>
        </div>

        <div class="custom-quote" id="customQuote" contenteditable="true" spellcheck="false"></div>

        <div class="time-section">
          <div class="date-main" id="dateMain">--</div>
          <div class="date-sub">
            <span class="week" id="week">--</span>
          </div>
          <div class="clock" id="time">--:--:--</div>
        </div>
      </section>

      <section class="panel panel-right">
        <div class="upload-placeholder" id="uploadPlaceholder">
          <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
          </svg>
          <p>点击上传图片或动图</p>
        </div>
        
        <div class="image-container">
          <img id="displayImage" alt="上传的图片" />
        </div>
        <input type="file" id="imageUpload" accept="image/*,image/gif">
      </section>
    </main>

    <footer class="controls" id="controlBar">
      <span class="ctl-label">刷新间隔</span>
      <select id="interval">
        <option value="0">手动刷新</option>
        <option value="1">1 分钟</option>
        <option value="5">5 分钟</option>
        <option value="10">10 分钟</option>
        <option value="15">15 分钟</option>
        <option value="30">30 分钟</option>
        <option value="60">60 分钟</option>
      </select>
      <button id="refreshBtn">立即刷新</button>
      <button id="rotateBtn">强制横屏</button>
      <button id="fullscreenBtn">全屏</button>
      <span id="status"></span>
    </footer>
  </div>
</div>

<script>
/* ================= 强制横屏逻辑 ================= */
const rotateBtn = document.getElementById('rotateBtn');
const body = document.body;

// 检查是否已经保存了状态
if (localStorage.getItem('forceLandscape') === 'true') {
  body.classList.add('force-landscape');
  rotateBtn.textContent = '恢复竖屏';
}

rotateBtn.addEventListener('click', () => {
  body.classList.toggle('force-landscape');
  if (body.classList.contains('force-landscape')) {
    rotateBtn.textContent = '恢复竖屏';
    localStorage.setItem('forceLandscape', 'true');
  } else {
    rotateBtn.textContent = '强制横屏';
    localStorage.setItem('forceLandscape', 'false');
  }
});

/* ================= 全屏逻辑 ================= */
const fullscreenBtn = document.getElementById('fullscreenBtn');
function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen();
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
    fullscreenBtn.textContent = '退出全屏';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    fullscreenBtn.textContent = '全屏';
  }
}
fullscreenBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('dblclick', toggleFullscreen); // 双击全屏

/* ================= 时钟 & 日期 ================= */
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2, '0');
const els = {
  city: document.getElementById('city'), wicon: document.getElementById('wicon'),
  temp: document.getElementById('temp'), wdesc: document.getElementById('wdesc'),
  feels: document.getElementById('feels'), hum: document.getElementById('hum'),
  wind: document.getElementById('wind'), dateMain: document.getElementById('dateMain'),
  week: document.getElementById('week'), time: document.getElementById('time'),
  status: document.getElementById('status'), interval: document.getElementById('interval'),
  refreshBtn: document.getElementById('refreshBtn'), customQuote: document.getElementById('customQuote')
};

function tick(){
  const d = new Date();
  els.time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  els.dateMain.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  els.week.textContent = WEEK[d.getDay()];
}
tick();
setInterval(tick, 1000);

/* ================= 艺术字自适应 ================= */
function adjustFontSize() {
  const text = (els.customQuote.textContent || '').replace(/\s/g, '');
  const len = text.length;
  if (len === 0) {
    els.customQuote.style.setProperty('--quote-size', '36px');
    return;
  }
  let baseSize = 72;
  if (len > 4) baseSize = 72 - (len - 4) * 2.5;
  if (baseSize < 22) baseSize = 22;
  
  // 根据当前容器的宽度动态计算，以适配强制旋转后的屏幕尺寸
  const containerWidth = document.getElementById('rotateWrapper').offsetWidth;
  const screenFactor = Math.min(containerWidth / 1200, 1);
  let finalSize = baseSize * screenFactor;
  if (finalSize < 18) finalSize = 18;

  els.customQuote.style.setProperty('--quote-size', `${finalSize}px`);
}

const savedQuote = localStorage.getItem('customQuoteText');
if (savedQuote) els.customQuote.textContent = savedQuote;
setTimeout(adjustFontSize, 100); // 延迟执行以适应旋转后的尺寸

els.customQuote.addEventListener('input', () => {
  if (els.customQuote.innerHTML === '<br>' || els.customQuote.innerHTML === '<div><br></div>') {
    els.customQuote.innerHTML = '';
  }
  localStorage.setItem('customQuoteText', els.customQuote.textContent);
  adjustFontSize();
});
els.customQuote.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault(); 
    document.execCommand('insertLineBreak'); 
  }
});
window.addEventListener('resize', () => setTimeout(adjustFontSize, 100));

/* ================= 图片上传 ================= */
const uploadPlaceholder = document.getElementById('uploadPlaceholder');
const imageUpload = document.getElementById('imageUpload');
const displayImage = document.getElementById('displayImage');

uploadPlaceholder.addEventListener('click', () => imageUpload.click());
imageUpload.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const objectUrl = URL.createObjectURL(file);
    displayImage.src = objectUrl;
    displayImage.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
    displayImage.onload = () => URL.revokeObjectURL(objectUrl);
  }
});

/* ================= 天气数据 ================= */
const WMO = {
  0:['晴','☀️'], 1:['晴间少云','🌤️'], 2:['多云','⛅'], 3:['阴','☁️'],
  45:['雾','🌫️'], 48:['雾凇','🌫️'], 51:['小毛毛雨','🌦️'], 53:['毛毛雨','🌦️'], 55:['大毛毛雨','🌦️'],
  56:['冻毛毛雨','🌧️'], 57:['强冻毛毛雨','🌧️'], 61:['小雨','🌦️'], 63:['中雨','🌧️'], 65:['大雨','🌧️'],
  66:['冻雨','🌧️'], 67:['强冻雨','🌧️'], 71:['小雪','🌨️'], 73:['中雪','🌨️'], 75:['大雪','❄️'], 77:['雪粒','🌨️'],
  80:['小阵雨','🌦️'], 81:['阵雨','🌧️'], 82:['强阵雨','⛈️'], 85:['小阵雪','🌨️'], 86:['大阵雪','❄️'],
  95:['雷阵雨','⛈️'], 96:['雷阵雨伴冰雹','⛈️'], 99:['强雷暴伴冰雹','⛈️']
};
const describe = code => WMO[code] || ['未知', '❔'];
const DEFAULT_LOC = { lat: 39.9042, lon: 116.4074 };

function getPosition(){
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve(null), { timeout: 8000, maximumAge: 600000 }
    );
  });
}

async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
    if (!r.ok) return '';
    const d = await r.json();
    return d.city || d.locality || d.principalSubdivision || '';
  }catch(e){ return ''; }
}

function setStatus(msg, isError){
  els.status.textContent = msg;
  els.status.classList.toggle('error', !!isError);
}

let loading = false;
async function loadWeather(){
  if (loading) return;
  loading = true;
  setStatus('正在刷新…');

  try{
    const pos = await getPosition();
    const loc = pos || DEFAULT_LOC;
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${loc.lat}&longitude=${loc.lon}`
      + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto';

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const cur = data.current || {};

    if (typeof cur.temperature_2m !== 'number') throw new Error('数据异常');

    const [text, icon] = describe(cur.weather_code);
    els.temp.textContent  = Math.round(cur.temperature_2m);
    els.wicon.textContent = icon;
    els.wdesc.textContent = text;
    els.feels.textContent = Math.round(cur.apparent_temperature) + '°';
    els.hum.textContent   = Math.round(cur.relative_humidity_2m) + '%';
    els.wind.textContent  = Math.round(cur.wind_speed_10m) + ' km/h';

    const cityName = await reverseGeocode(loc.lat, loc.lon);
    els.city.textContent = cityName || (pos ? '当前位置' : '北京 · 默认位置');

    const t = new Date();
    setStatus(`更新于 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`);
  }catch(err){
    setStatus('获取失败，请检查网络', true);
  }finally{
    loading = false;
  }
}

/* ================= 自动刷新控制 ================= */
const ALLOWED = [0, 1, 5, 10, 15, 30, 60];
let timer = null;
function scheduleRefresh(minutes){
  clearInterval(timer);
  if (minutes > 0) timer = setInterval(loadWeather, minutes * 60 * 1000);
}
const savedInterval = Number(localStorage.getItem('weatherRefreshMinutes'));
let minutes = ALLOWED.includes(savedInterval) ? savedInterval : 10;
els.interval.value = String(minutes);
scheduleRefresh(minutes);

els.interval.addEventListener('change', () => {
  minutes = Number(els.interval.value);
  localStorage.setItem('weatherRefreshMinutes', String(minutes));
  scheduleRefresh(minutes);
  setStatus(minutes > 0 ? `自动刷新：每 ${minutes} 分钟` : '已切换为手动刷新');
});
els.refreshBtn.addEventListener('click', loadWeather);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadWeather();
});

/* ================= 启动 ================= */
loadWeather();
</script>
</body>
</html>
