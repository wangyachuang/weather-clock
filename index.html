<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气时钟相册</title>
<style>
  :root{
    --text: #eaf1ff;
    --muted: rgba(234,241,255,.55);
    --line: rgba(255,255,255,.10);
    --accent: #5eead4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow: hidden;
    background:
      radial-gradient(1200px 700px at 10% -15%, #1e3a6e 0%, transparent 62%),
      radial-gradient(1000px 650px at 105% 115%, #2c1c5e 0%, transparent 62%),
      #070b16;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 整体布局（横屏） ===== */
  .app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 24px 10px;
  }

  .main{
    flex: 1;
    display: flex;
    gap: 20px;
    min-height: 0;
  }

  .panel{
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid var(--line);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    animation: rise .6s cubic-bezier(.2,.8,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to  { opacity:1; transform: none; }
  }

  /* ===== 左：天气 + 时间 ===== */
  .panel-left{
    flex: 0 0 32%;
    padding: clamp(22px, 3.2vh, 44px);
    justify-content: space-between;
    gap: 20px;
    animation-delay: .05s;
  }

  /* 天气部分 */
  .weather-section {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.5vh, 20px);
  }

  .location{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(13px, 1.3vw, 19px);
    letter-spacing: .1em;
    color: var(--muted);
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    animation: pulse 2s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse{ 50%{ opacity:.3; transform: scale(.75); } }

  .weather-main{
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.2vw, 18px);
  }

  .wicon{
    font-size: clamp(48px, 6vw, 90px);
    line-height: 1;
    filter: drop-shadow(0 10px 26px rgba(94,234,212,.22));
  }

  .temp{
    display: flex;
    align-items: flex-start;
    font-size: clamp(50px, 7.5vw, 110px);
    font-weight: 200;
    line-height: .86;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
  }
  .temp .unit{
    font-size: .26em;
    font-weight: 400;
    color: var(--muted);
    margin-top: .55em;
    margin-left: .12em;
    letter-spacing: 0;
  }

  .desc{
    font-size: clamp(15px, 1.6vw, 22px);
    letter-spacing: .07em;
    color: rgba(234,241,255,.85);
  }

  .metrics{
    display: flex;
    gap: 12px;
    padding-top: clamp(10px, 1.5vh, 16px);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .metric{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .metric .label{
    font-size: clamp(10px, .9vw, 12px);
    letter-spacing: .14em;
    color: var(--muted);
  }
  .metric .value{
    font-size: clamp(14px, 1.5vw, 20px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* 时间部分 */
  .time-section {
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  
  .date-main{
    font-size: clamp(24px, 2.8vw, 42px);
    font-weight: 200;
    line-height: 1.1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .date-sub{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .week{
    padding: 4px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 1.2vw, 16px);
    color: #a7f3e4;
    background: rgba(94,234,212,.12);
    border: 1px solid rgba(94,234,212,.30);
  }
  .clock{
    font-size: clamp(36px, 4.5vw, 68px);
    font-weight: 300;
    letter-spacing: .05em;
    color: rgba(234,241,255,.85);
    font-variant-numeric: tabular-nums;
  }

  /* ===== 右：图片展示区 ===== */
  .panel-right{
    flex: 1;
    position: relative;
    padding: 12px;
    animation-delay: .12s;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.2);
  }

  /* 图片容器 */
  .image-container {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 保持比例填满，如想完整显示可改为 contain */
    display: none; /* 默认隐藏，上传后显示 */
  }

  /* 上传提示区 */
  .upload-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border: 2px dashed rgba(255,255,255,.15);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .upload-placeholder:hover {
    background: rgba(255,255,255,.05);
    border-color: rgba(94,234,212,.5);
  }

  .upload-placeholder svg {
    width: 48px;
    height: 48px;
    fill: var(--muted);
    margin-bottom: 12px;
    transition: fill 0.3s ease;
  }
  
  .upload-placeholder:hover svg {
    fill: var(--accent);
  }

  .upload-placeholder p {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* 隐藏的 input */
  #imageUpload {
    display: none;
  }

  /* 底部控制条 */
  .controls{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    padding: 2px 6px 4px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .controls .ctl-label{ letter-spacing: .12em; }

  select, button{
    font: inherit;
    color: var(--text);
    background: rgba(255,255,255,.07);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 13px;
    cursor: pointer;
    outline: none;
    transition: background .18s, border-color .18s, transform .1s;
  }
  select:hover, button:hover{
    background: rgba(255,255,255,.15);
    border-color: rgba(255,255,255,.22);
  }
  button:active{ transform: scale(.96); }
  select option{ background:#141b2c; color:#eaf1ff; }

  #status{
    min-width: 160px;
    letter-spacing: .05em;
    transition: color .2s;
  }
  #status.error{ color: #fca5a5; }

  /* ===== 竖屏兜底 ===== */
  @media (max-aspect-ratio: 1/1){
    body{ overflow: auto; }
    .app{ height: auto; min-height: 100dvh; }
    .main{ flex-direction: column; }
    .panel-left{ flex: none; }
    .panel-right { min-height: 400px; }
  }
</style>
</head>
<body>

<div class="app">
  <main class="main">

    <!-- 左侧：天气 + 时间 -->
    <section class="panel panel-left">
      
      <!-- 天气部分 -->
      <div class="weather-section">
        <div class="location">
          <span class="dot"></span>
          <span id="city">定位中…</span>
        </div>

        <div class="weather-main">
          <div class="wicon" id="wicon">⛅</div>
          <div class="temp">
            <span id="temp">--</span><span class="unit">°C</span>
          </div>
        </div>

        <div class="desc" id="wdesc">正在获取天气…</div>

        <div class="metrics">
          <div class="metric">
            <span class="label">体感</span>
            <span class="value" id="feels">--</span>
          </div>
          <div class="metric">
            <span class="label">湿度</span>
            <span class="value" id="hum">--</span>
          </div>
          <div class="metric">
            <span class="label">风速</span>
            <span class="value" id="wind">--</span>
          </div>
        </div>
      </div>

      <!-- 时间部分（已移入左侧） -->
      <div class="time-section">
        <div class="date-main" id="dateMain">--</div>
        <div class="date-sub">
          <span class="week" id="week">--</span>
        </div>
        <div class="clock" id="time">--:--:--</div>
      </div>

    </section>

    <!-- 右侧：图片/动图展示区 -->
    <section class="panel panel-right">
      <!-- 上传占位提示（点击触发文件选择） -->
      <div class="upload-placeholder" id="uploadPlaceholder">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <p>点击上传图片或动图 (GIF)</p>
      </div>
      
      <!-- 实际展示图片的标签 -->
      <div class="image-container">
        <img id="displayImage" alt="上传的图片" />
      </div>

      <!-- 隐藏的文件选择器 -->
      <input type="file" id="imageUpload" accept="image/*,image/gif">
    </section>

  </main>

  <!-- 底部控制条 -->
  <footer class="controls">
    <span class="ctl-label">刷新间隔</span>
    <select id="interval">
      <option value="0">手动刷新</option>
      <option value="1">1 分钟</option>
      <option value="5">5 分钟</option>
      <option value="10">10 分钟</option>
      <option value="15">15 分钟</option>
      <option value="30">30 分钟</option>
      <option value="60">60 分钟</option>
    </select>
    <button id="refreshBtn">立即刷新</button>
    <span id="status"></span>
  </footer>
</div>

<script>
/* ================= 时钟 & 日期 ================= */
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const pad = n => String(n).padStart(2, '0');

const els = {
  city:      document.getElementById('city'),
  wicon:     document.getElementById('wicon'),
  temp:      document.getElementById('temp'),
  wdesc:     document.getElementById('wdesc'),
  feels:     document.getElementById('feels'),
  hum:       document.getElementById('hum'),
  wind:      document.getElementById('wind'),
  dateMain:  document.getElementById('dateMain'),
  week:      document.getElementById('week'),
  time:      document.getElementById('time'),
  status:    document.getElementById('status'),
  interval:  document.getElementById('interval'),
  refreshBtn:document.getElementById('refreshBtn'),
};

function tick(){
  const d = new Date();
  els.time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  els.dateMain.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  els.week.textContent = WEEK[d.getDay()];
}
tick();
setInterval(tick, 1000);

/* ================= 图片上传功能 ================= */
const uploadPlaceholder = document.getElementById('uploadPlaceholder');
const imageUpload = document.getElementById('imageUpload');
const displayImage = document.getElementById('displayImage');

// 点击占位区触发文件选择
uploadPlaceholder.addEventListener('click', () => {
  imageUpload.click();
});

// 处理文件选择
imageUpload.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    // 生成临时 URL 并显示
    const objectUrl = URL.createObjectURL(file);
    displayImage.src = objectUrl;
    displayImage.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
    
    // 清理旧的 URL 避免内存泄漏
    displayImage.onload = () => {
      URL.revokeObjectURL(objectUrl);
    };
  }
});

/* ================= 天气数据 ================= */
const WMO = {
  0:['晴','☀️'],        1:['晴间少云','🌤️'],  2:['多云','⛅'],      3:['阴','☁️'],
  45:['雾','🌫️'],       48:['雾凇','🌫️'],
  51:['小毛毛雨','🌦️'], 53:['毛毛雨','🌦️'],   55:['大毛毛雨','🌦️'],
  56:['冻毛毛雨','🌧️'], 57:['强冻毛毛雨','🌧️'],
  61:['小雨','🌦️'],     63:['中雨','🌧️'],     65:['大雨','🌧️'],
  66:['冻雨','🌧️'],     67:['强冻雨','🌧️'],
  71:['小雪','🌨️'],     73:['中雪','🌨️'],     75:['大雪','❄️'],  77:['雪粒','🌨️'],
  80:['小阵雨','🌦️'],   81:['阵雨','🌧️'],     82:['强阵雨','⛈️'],
  85:['小阵雪','🌨️'],   86:['大阵雪','❄️'],
  95:['雷阵雨','⛈️'],   96:['雷阵雨伴冰雹','⛈️'], 99:['强雷暴伴冰雹','⛈️']
};
const describe = code => WMO[code] || ['未知', '❔'];

const DEFAULT_LOC = { lat: 39.9042, lon: 116.4074 };

function getPosition(){
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve(null),
      { timeout: 8000, maximumAge: 600000 }
    );
  });
}

async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(
      `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`
    );
    if (!r.ok) return '';
    const d = await r.json();
    return d.city || d.locality || d.principalSubdivision || '';
  }catch(e){ return ''; }
}

function setStatus(msg, isError){
  els.status.textContent = msg;
  els.status.classList.toggle('error', !!isError);
}

let loading = false;

async function loadWeather(){
  if (loading) return;
  loading = true;
  setStatus('正在刷新…');

  try{
    const pos = await getPosition();
    const loc = pos || DEFAULT_LOC;

    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${loc.lat}&longitude=${loc.lon}`
      + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m'
      + '&timezone=auto';

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const cur = data.current || {};

    if (typeof cur.temperature_2m !== 'number') throw new Error('数据异常');

    const [text, icon] = describe(cur.weather_code);
    els.temp.textContent  = Math.round(cur.temperature_2m);
    els.wicon.textContent = icon;
    els.wdesc.textContent = text;
    els.feels.textContent = Math.round(cur.apparent_temperature) + '°';
    els.hum.textContent   = Math.round(cur.relative_humidity_2m) + '%';
    els.wind.textContent  = Math.round(cur.wind_speed_10m) + ' km/h';

    const cityName = await reverseGeocode(loc.lat, loc.lon);
    els.city.textContent = cityName || (pos ? '当前位置' : '北京 · 默认位置');

    const t = new Date();
    setStatus(`更新于 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`);
  }catch(err){
    console.error(err);
    setStatus('天气获取失败，请检查网络', true);
  }finally{
    loading = false;
  }
}

/* ================= 自动刷新控制 ================= */
const ALLOWED = [0, 1, 5, 10, 15, 30, 60];
let timer = null;

function scheduleRefresh(minutes){
  clearInterval(timer);
  if (minutes > 0) timer = setInterval(loadWeather, minutes * 60 * 1000);
}

const saved = Number(localStorage.getItem('weatherRefreshMinutes'));
let minutes = ALLOWED.includes(saved) ? saved : 10;
els.interval.value = String(minutes);
scheduleRefresh(minutes);

els.interval.addEventListener('change', () => {
  minutes = Number(els.interval.value);
  localStorage.setItem('weatherRefreshMinutes', String(minutes));
  scheduleRefresh(minutes);
  setStatus(minutes > 0 ? `自动刷新：每 ${minutes} 分钟` : '已切换为手动刷新');
});

els.refreshBtn.addEventListener('click', loadWeather);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadWeather();
});

/* ================= 启动 ================= */
loadWeather();
</script>
</body>
</html>
